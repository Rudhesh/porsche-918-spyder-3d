<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M 20 20 L 180 20 C 180 120 160 190 100 230 C 40 190 20 120 20 20 Z"/>
    </clipPath>
  </defs>

  <!-- Outer Shield Shadow -->
  <path d="M 18 18 L 182 18 C 182 122 162 193 100 234 C 38 193 18 122 18 18 Z" fill="#000" opacity="0.4"/>

  <!-- Main Gold Shield Base -->
  <path d="M 20 20 L 180 20 C 180 120 160 190 100 230 C 40 190 20 120 20 20 Z" fill="url(#goldGrad)" stroke="#111827" stroke-width="4"/>

  <g clip-path="url(#shieldClip)">
    <!-- Top Brand Banner: PORSCHE -->
    <rect x="20" y="20" width="160" height="34" fill="url(#goldLight)"/>
    <path d="M 20 54 L 180 54" stroke="#111827" stroke-width="3"/>
    
    <text x="100" y="44" 
          font-family="Arial, Helvetica, sans-serif" 
          font-weight="900" 
          font-size="15" 
          fill="#111827" 
          text-anchor="middle" 
          letter-spacing="4">
      PORSCHE
    </text>

    <!-- Quadrants Division Lines -->
    <line x1="100" y1="54" x2="100" y2="230" stroke="#111827" stroke-width="3"/>
    <line x1="20" y1="125" x2="180" y2="125" stroke="#111827" stroke-width="3"/>

    <!-- Top-Right Quadrant: Red & Black Stripes (Württemberg) -->
    <g transform="translate(100, 54)">
      <rect x="0" y="0" width="80" height="14" fill="url(#redGrad)"/>
      <rect x="0" y="14" width="80" height="14" fill="#111827"/>
      <rect x="0" y="28" width="80" height="14" fill="url(#redGrad)"/>
      <rect x="0" y="42" width="80" height="15" fill="#111827"/>
      <rect x="0" y="57" width="80" height="14" fill="url(#redGrad)"/>
    </g>

    <!-- Bottom-Left Quadrant: Red & Black Stripes -->
    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="80" height="15" fill="url(#redGrad)"/>
      <rect x="0" y="15" width="80" height="15" fill="#111827"/>
      <rect x="0" y="30" width="80" height="15" fill="url(#redGrad)"/>
      <rect x="0" y="45" width="80" height="15" fill="#111827"/>
      <rect x="0" y="60" width="80" height="15" fill="url(#redGrad)"/>
      <rect x="0" y="75" width="80" height="15" fill="#111827"/>
    </g>

    <!-- Top-Left Quadrant: Antlers (Gold background + black antlers) -->
    <g transform="translate(25, 58)">
      <!-- Antler 1 -->
      <path d="M 12 12 Q 35 15 65 14 M 25 13 Q 28 6 32 4 M 40 14 Q 44 6 49 5 M 55 14 Q 58 8 62 6" 
            stroke="#111827" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <!-- Antler 2 -->
      <path d="M 14 30 Q 38 33 65 31 M 27 31 Q 30 24 34 22 M 42 32 Q 46 24 51 23 M 56 32 Q 59 26 63 24" 
            stroke="#111827" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <!-- Antler 3 -->
      <path d="M 18 48 Q 40 50 65 48 M 30 49 Q 33 42 37 40 M 45 49 Q 49 42 54 41 M 57 49 Q 60 44 64 42" 
            stroke="#111827" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Bottom-Right Quadrant: Antlers -->
    <g transform="translate(105, 128)">
      <!-- Antler 1 -->
      <path d="M 10 12 Q 32 14 62 13 M 22 13 Q 25 6 29 4 M 37 14 Q 41 6 46 5 M 52 14 Q 55 8 59 6" 
            stroke="#111827" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Antler 2 -->
      <path d="M 10 30 Q 32 32 58 30 M 22 31 Q 25 24 29 22 M 37 32 Q 41 24 46 23 M 50 31 Q 53 25 56 23" 
            stroke="#111827" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Antler 3 -->
      <path d="M 10 48 Q 28 50 48 48 M 20 49 Q 23 42 27 40 M 34 49 Q 38 42 42 41" 
            stroke="#111827" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Center Stuttgart Inescutcheon (Inner Shield) -->
    <g transform="translate(68, 86)">
      <!-- Inner Shield Body -->
      <path d="M 2 2 L 62 2 C 62 40 52 65 32 78 C 12 65 2 40 2 2 Z" 
            fill="url(#goldGrad)" stroke="#111827" stroke-width="2.5"/>
      
      <!-- STUTTGART Text Banner -->
      <rect x="2" y="2" width="60" height="12" fill="url(#goldLight)"/>
      <line x1="2" y1="14" x2="62" y2="14" stroke="#111827" stroke-width="1.5"/>
      <text x="32" y="11" 
            font-family="Arial, Helvetica, sans-serif" 
            font-weight="900" 
            font-size="6" 
            fill="#111827" 
            text-anchor="middle" 
            letter-spacing="0.8">
        STUTTGART
      </text>

      <!-- Stuttgart Prancing Horse Silhouette -->
      <path d="M 33 22 
               C 34 20, 37 19, 39 21 
               C 38 23, 35 25, 34 26 
               C 37 28, 41 31, 39 36 
               C 38 38, 36 39, 34 38 
               C 33 41, 35 48, 38 52 
               C 39 54, 38 56, 36 56 
               C 33 54, 32 50, 31 46 
               C 29 49, 27 55, 24 57 
               C 23 57, 22 55, 23 53 
               C 26 49, 27 45, 26 42 
               C 23 44, 21 47, 19 49 
               C 18 48, 18 46, 20 44 
               C 23 41, 25 36, 25 32 
               C 23 31, 20 33, 18 35 
               C 17 34, 18 32, 21 30 
               C 25 28, 27 24, 30 22 
               C 30 20, 31 18, 33 22 Z" 
            fill="#111827"/>
      <!-- Horse Tail Flow -->
      <path d="M 23 33 C 18 36, 17 43, 20 48 C 18 45, 19 38, 24 34 Z" fill="#111827"/>
    </g>

    <!-- Golden Inner Shield Border Highlight -->
    <path d="M 24 24 L 176 24 C 176 118 157 186 100 224 C 43 186 24 118 24 24 Z" 
          fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
